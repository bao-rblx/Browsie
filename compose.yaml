services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://browsie:browsiepass@db:5432/browsiedb
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - LLM_PROVIDER=mock
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BROWSIE_API_TOKEN=${BROWSIE_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: browsie
      POSTGRES_PASSWORD: browsiepass
      POSTGRES_DB: browsiedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U browsie -d browsiedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
