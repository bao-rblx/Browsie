name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint backend with ruff
        run: |
          ruff check backend/app backend/tests

      - name: Run Pytest suite
        run: |
          cd backend
          pytest -v

  extension-test:
    name: Extension Lint & Node Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        run: |
          cd extension
          npm ci

      - name: Run extension tests
        run: |
          cd extension
          npm test

  build-check:
    name: Container Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          echo "Verifying project structure and critical files..."
          test -f README.md
          test -d backend
          test -d extension
