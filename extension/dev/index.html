<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Browsie UI preview</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; background: #f1f3f4; color: #202124; }
    header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #dadce0; }
    h1 { font-size: 18px; margin: 0; } p { margin: 4px 0 0; color: #5f6368; }
    .grid { display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px 20px; }
    figure { margin: 0; background: #fff; border: 1px solid #dadce0; border-radius: 8px; overflow: hidden; }
    figcaption { padding: 6px 10px; font-weight: 600; border-bottom: 1px solid #dadce0; display: flex; justify-content: space-between; }
    figcaption a { font-weight: 400; font-size: 12px; }
    iframe { border: 0; width: 100%; display: block; background: #fff; }
    .wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header><h1>Browsie — UI preview</h1><p>Real extension pages with a fake chrome.* API and sample data. Not the installed extension.</p></header>
  <div class="grid">
    <figure><figcaption>Toolbar popup <a href="/popup/popup.html" target="_blank">open</a></figcaption><iframe src="/popup/popup.html" height="560" title="Popup"></iframe></figure>
    <figure><figcaption>Page with warnings (content script) <a href="/dev/demo-page.html" target="_blank">open</a></figcaption><iframe src="/dev/demo-page.html" height="560" title="Demo page"></iframe></figure>
    <figure class="wide"><figcaption>Options — settings, allowlist, history <a href="/options/options.html" target="_blank">open</a></figcaption><iframe src="/options/options.html" height="760" title="Options"></iframe></figure>
    <figure class="wide"><figcaption>First-run consent <a href="/consent/consent.html" target="_blank">open</a></figcaption><iframe src="/consent/consent.html" height="560" title="Consent"></iframe></figure>
  </div>
</body>
</html>
